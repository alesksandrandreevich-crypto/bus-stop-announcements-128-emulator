const $=id=>document.getElementById(id),LS=localStorage;
const UK="Українська|ЗУПИНКА:|КІНЦЕВА|НАСТУПНА:|Наступна зупинка:|Виконано.|Запис зупинки.|П/С - далi...|Запис наступної.|Виконується...|Вiдмiна.|Поновити.|Виберiть № маршруту:|Усі світити|Усі погасити|Шахматка 0|Шахматка 1|Виберiть кiнцеву:|П/С-для продовж.:|Переднє|Бічне 1|Внутрішнє 1|Заднє|Внутрішнє 2|Бічне 2|Бічне 3|Внутрішнє 3|Внутрішнє 4|MODE (РЕЖИМ):|Збереження зупинки|Тест однократний|Тест циклічний|Тест функц.|Lang (Мова)|Яскравість|Параметри табло|Скинути параметри|Статус БК|УВIМКНЕНО|ВИМКНУТО|Виведення на табло|Номер рядка|Виводити|Не виводити|Нема|Ф.Тест, циклів=%d|Помилок=%d|Буде відновлено ост. стан|Вибрати КІНЦЕВУ|В БК нема RTC|Додатк.оголош.:|Дод.Оголошення|Оголошення|Гучність|в салоні|в кабіні|мікрофону|Рестарт Flash Card|Допоміжний текст|Швидкість|Нема зв'язку|Корекція|Зовн.Оповіщення|GPS параметри|Підкл./Відкл.|Дистанція|Швидкість від'їзду|Швидкість прибуття|Кіл-сть пр.файлів|Похибка GPS|АвтоСамонавчання|Самонавчання|Пр.файлів 1-ї зуп.|Зміна напрямку на кінцевій|При прибутті|При відправленні|Файл маршрутів|Файл не знайдено|Реж.зовн.табло|2 кінцеві|Кінцева та проміжні|Одна кінцева".split('|');
const S={routes:[],r:0,dir:0,k:1,mode:'run',menu:null,sel:0,ops:[],adds:[],ev:[],blocks:{},addOn:[0,0,0,0],cnt:[0,0,0,0],opN:[0,0],busy:0,ch:'',run:'',tl:0,Z:null,root:'',SD:'S/',pfs:[],LANGS:[{n:'Українська',L:UK}],lastAd:'',
 cfg:{lang:0,vm:7,vs:7,vp:8,vc:5,ve:14,ext:1,disp:0,flip:0,enc:'auto',aux:1,sv:0,pf:'P.TXT',gps:0,gd:40,gw:0,gs:0,g1:0,err:15,pause:5,nobell:0}};S.gf={};const GK=['gps','gd','gw','gs','g1','err','uere','tz','dst','learn','pause','warn'];

const save=()=>LS.bk2=JSON.stringify(S.cfg);
const t=i=>{const L=(S.LANGS[S.cfg.lang]||S.LANGS[0]).L;return(L[i]&&L[i].trim())||UK[i]||''};

const idb=(m,v)=>new Promise((res,rej)=>{const r=indexedDB.open('bk',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onerror=rej;r.onsuccess=()=>{const tx=r.result.transaction('f',m=='get'?'readonly':'readwrite'),s=tx.objectStore('f'),q=m=='get'?s.get('zip'):s.put(v,'zip');tx.oncomplete=()=>res(q.result);tx.onerror=rej}});

function mask(text,h,px,base){const c=mask.c||(mask.c=document.createElement('canvas')),x=c.getContext('2d',{willReadFrequently:true});
 x.font=`bold ${px}px ${FONT}`;const w=Math.max(1,Math.ceil(x.measureText(text).width)+1);c.width=w;c.height=h;

 const d=x.getImageData(0,0,w,h).data,o=new Uint8Array(w*h);for(let i=0;i<o.length;i++)o[i]=d[i*4+3]>110?1:0;return{w,h,d:o}}
class Board{constructor(id,w,h,sp){this.cv=$(id);this.cv.width=w*4;this.cv.height=h*4;this.cx=this.cv.getContext('2d');this.w=w;this.h=h;this.sp=sp;this.layers=[];this.key=null;this.t0=0;this.last=0;this.buf=new Uint8Array(w*h)}
 set(key,fn){if(key===this.key)return;this.key=key;this.layers=fn();this.t0=performance.now()}
 draw(now){if(now-this.last<33)return;this.last=now;const el=now-this.t0,W=this.w,b=this.buf.fill(0);
  let ov=0;for(const L of this.layers)if(!L.loop&&!L.fix)ov=Math.max(ov,L.m.w-L.rw);
  const P=2000,sc=ov/this.sp*1000,ph=el%(P+sc+P),shift=ph<P?0:Math.min(ph-P,sc)*this.sp/1000;   // усі рядки табло крутяться за одним годинником
  for(const L of this.layers){let off=0;if(L.loop)off=-L.rw+Math.floor(el/1000*this.sp)%(L.m.w+L.rw);else if(!L.fix)off=Math.min(Math.floor(shift),Math.max(0,L.m.w-L.rw));
   for(let y=0;y<L.m.h;y++)for(let x=0;x<L.rw;x++){const sx=x+off;if(sx>=0&&sx<L.m.w&&L.m.d[y*L.m.w+sx])b[(L.y+y)*W+L.x+x]=1}}
  const c=this.cx;c.fillStyle='#000';c.fillRect(0,0,W*4,this.h*4);
  for(const v of[0,1]){c.fillStyle=v?'#ff9a1a':'#2a1b06';for(let i=0;i<b.length;i++)if(b[i]==v)c.fillRect((i%W)*4+.5,((i/W)|0)*4+.5,3,3)}}}

function setBoards(){const r=rt(),q=seq();let num='',l1='',l2='';

 if(S.mode=='route'){const n=S.routes.length;if(k=='L'||k=='R'||k=='MSH'){S.sel=(S.sel+(k=='L'?n-1:1))%n;pi(S.routes[S.sel].f)}   // Мш перемикає маршрути по колу

  else if(k=='RST'){stop();S.mode='run'}draw();return}
 if(S.mode=='term'){const T=terms();
  if(k=='KON'||k=='L'||k=='R'){S.sel=(S.sel+1)%T.length;pi(T[S.sel].dep)}

  else if(k=='RST'){stop();S.mode='run'}draw();return}
 if(S.mode=='add'){const ix={KON:0,OP1:1,OP2:2,PS:3}[k];
  if(ix!==undefined){S.addOn[ix]^=1;if(S.addOn[ix]&&S.adds[ix]?.has)pi(S.adds[ix].f)}else if(k=='D'||k=='RST')S.mode='run';draw();return}

  case 'RST':S.mode='run';draw();break}}

let gw=null;
const hav=(a,b)=>{const r=Math.PI/180,x=(b.lo-a.lo)*r*Math.cos((a.la+b.la)/2*r),y=(b.la-a.la)*r;return 6371000*Math.hypot(x,y)};
function gpsSync(){gpsL();if(G('gps')&&navigator.geolocation){if(gw===null)gw=navigator.geolocation.watchPosition(onPos,e=>{$('gps').textContent='GPS: '+e.message},{enableHighAccuracy:true,maximumAge:0,timeout:30000})}
 else{if(gw!==null)navigator.geolocation.clearWatch(gw);gw=null;$('gps').textContent=''}}
function onPos(p){const c=p.coords,P={la:c.latitude,lo:c.longitude,acc:c.accuracy||0,t:p.timestamp};let sp=c.speed;if(sp==null&&S.pos)sp=hav(S.pos,P)/Math.max(1,(P.t-S.pos.t)/1000);P.sp=sp||0;S.pos=P;gpsStep()}
function gpsStep(){const P=S.pos,s=rt()&&cur();if(!P||!s)return;
 if(!s.gp){$('gps').textContent='GPS: у зупинки «'+s.name+'» немає координат';return}
 const D=s.gp.d||G('gd'),d=hav(P,s.gp),eff=Math.max(G('err'),P.acc);
 $('gps').textContent=`GPS: ${Math.round(d)} м до «${s.name}» (поріг ${D} м), точність ${Math.round(P.acc)} м, ${ph()=='dep'?'рух до зупинки':'на зупинці'}`;

  if(d<=D&&(!w||S.wpOK)&&(!G('gw')||P.sp<1))move(1,false,true)}

  if(Date.now()-S.arrT>=G('pause')*1000&&d-S.minD>eff)move(1,false,true)}}   // ТС віддаляється — «Наступна»
